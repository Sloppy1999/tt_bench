[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-bench"
version = "0.2.0"
description = "Turing Tumble benchmark — LLM evaluation on puzzle-solving tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "networkx>=3.6.1",
    "pandas>=3.0.3",
    "pyqt6>=6.11",
    "python-dotenv>=1.2",
    "requests>=2.33",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[project.scripts]
tt-benchmark = "tt_bench.benchmark.runner:main"
tt-simulate = "tt_bench.cli.simulate:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
